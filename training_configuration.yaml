# Training settings. Omitted keys use TrainingCFG defaults.
# Use scheduler_type: null to disable scheduling.
# Transform lists define complete pipelines, applied in order.
# Minimum loss decrease from the last accepted best to reset patience (0 accepts any decrease).
experiment_name: isic2019-baseline
run_name: resnet18-imagenet-finetune
epochs: 100
batch_size: 128
num_workers: 4
seed: 42
# Train, validation, test fractions; remaining data is unused.
split_ratios: [0.3, 0.1, 0.1]
optimizer: AdamW
optimizer_kwargs:
  lr: 0.0001
  weight_decay: 0.001
loss_function: CrossEntropyLoss
loss_function_kwargs:
  reduction: mean
scheduler_type: ReduceLROnPlateau
scheduler_kwargs:
  mode: min
  patience: 3
  factor: 0.1
early_stopping_patience: 6
early_stopping_tolerance: 0.01
train_transforms:
- EnsureChannelFirst:
    channel_dim: -1
- Resize:
    spatial_size:
    - 224
    - 224
- RandFlip:
    prob: 0.5
    spatial_axis: 1
- ScaleIntensityRange:
    a_min: 0
    a_max: 255
    b_min: 0
    b_max: 1
- NormalizeIntensity:
    subtrahend: [0.485, 0.456, 0.406]
    divisor: [0.229, 0.224, 0.225]
    channel_wise: true
- ToTensor:
    track_meta: false
val_transforms:
- EnsureChannelFirst:
    channel_dim: -1
- Resize:
    spatial_size:
    - 224
    - 224
- ScaleIntensityRange:
    a_min: 0
    a_max: 255
    b_min: 0
    b_max: 1
- NormalizeIntensity:
    subtrahend: [0.485, 0.456, 0.406]
    divisor: [0.229, 0.224, 0.225]
    channel_wise: true
- ToTensor:
    track_meta: false
