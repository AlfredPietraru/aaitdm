[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-isic"
version = "1.0.0"
description = "Minimal Flower FedAvg/FedProx experiment on ISIC 2019 with simulated hospitals"
license = "Apache-2.0"
dependencies = [
    "flwr==1.43.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "monai==1.6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["fl_isic"]

[tool.flwr.app]
publisher = "aitdm"

[tool.flwr.app.components]
serverapp = "fl_isic.server_app:app"
clientapp = "fl_isic.client_app:app"

# Runtime settings come from app-state/federated_configuration.yaml via the launcher.
[tool.flwr.app.config]
